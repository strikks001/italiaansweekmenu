<!doctype html>
<html lang="nl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Cruciaal: dit is een tijdelijk scherm, geen homepage. Zonder noindex kan
     Google dit vastleggen als waar italiaansweekmenu.nl over gaat, en dat is
     later lastig terug te draaien. -->
  <meta name="robots" content="noindex, nofollow">

  <title>Italiaans weekmenu — binnenkort</title>
  <meta name="description"
    content="Elke week een compleet Italiaans weekmenu met recepten voor elke dag. Binnenkort online.">

  <style>
    /* Bewust terughoudend gehouden: de huisstijl van de site ligt nog niet vast,
     en dit scherm hoort daar niet op vooruit te lopen. */
    :root {
      --ground: #fcfcfb;
      --surface: #ffffff;
      --line: #e4e4e1;
      --text: #1c1c1a;
      --muted: #63635e;
      --accent: #3f6f4b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #131313;
        --surface: #1a1a19;
        --line: #2e2e2c;
        --text: #f2f2f0;
        --muted: #a3a39d;
        --accent: #8fbf9b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      background: var(--ground);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 34rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .lead {
      margin: 1.25rem auto 0;
      max-width: 28rem;
      font-size: 1.0625rem;
      color: var(--muted);
      text-wrap: pretty;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Binnenkort online</p>

    <h1>Elke week een Italiaans weekmenu</h1>

    <p class="lead">
      Zeven dagen, meerdere gerechten. We zijn de eerste menu's aan het schrijven.
    </p>

    <footer>italiaansweekmenu.nl</footer>
  </main>
</body>

</html>
