    /* Same tokens as the site, hand-written because this page runs outside
       Nuxt as its own Worker. */
    :root {
      --vermilion: #ff3b14;
      --vermilion-ink: #420a03;
      --ceramic: #2b2d7a;
      --butter: #ffe9a8;
      --butter-ink: #2a1f07;
      --ground: #ffffff;
      --ink: #1c1917;
      --muted: #57534e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #12100f;
        --ink: #faf7f5;
        --muted: #a8a29e;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--ground);
      color: var(--ink);
      font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .band {
      position: relative;
      background: var(--vermilion);
      color: var(--vermilion-ink);
      padding: 4.5rem 1.5rem 6rem;
      text-align: center;
    }

    /* The scallop: the recurring gesture of the house style. */
    .band::after {
      content: "";
      position: absolute;
      inset-inline: 0;
      bottom: -1px;
      height: 1.75rem;
      background:
        radial-gradient(circle at 50% 100%, var(--ground) 0.875rem, transparent 0.875rem)
        0 0 / 2.25rem 1.75rem repeat-x;
    }

    .inner { max-width: 46rem; margin: 0 auto; }

    .pill {
      display: inline-block;
      background: var(--butter);
      color: var(--butter-ink);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      /* White because it is large: 3.57 clears the bar for large text, not for
         small. The lead below stays near-black for that reason. */
      color: #ffffff;
      font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.035em;
      text-wrap: balance;
      margin: 1.5rem 0 0;
    }

    .lead {
      margin: 1.5rem auto 0;
      max-width: 34rem;
      font-size: 1.125rem;
      text-wrap: pretty;
    }

    .rest {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
    }

    .card {
      background: var(--ceramic);
      color: #ffffff;
      border-radius: 1rem;
      padding: 1.75rem 2rem;
      text-align: center;
      max-width: 30rem;
    }

    .card p { margin: 0; font-size: 0.9375rem; }

    .card a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      background: #ffffff;
      color: var(--ceramic);
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
    }

    .card a:hover { background: var(--butter); color: var(--butter-ink); }

    footer {
      padding: 0 1.5rem 2.5rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="band">
    <div class="inner">
      <p class="pill">Binnenkort online</p>
      <h1>Elke week een Italiaans weekmenu</h1>
      <p class="lead">
        Zeven dagen, meerdere gerechten, en de boodschappenlijst erbij.
        We zijn de eerste menu&rsquo;s aan het schrijven.
      </p>
    </div>
  </div>

  <div class="rest">
    <div class="card">
      <p>De Italiaanse producten uit onze recepten vind je nu al in de webshop.</p>
      <a href="https://www.spesadaantonio.nl" rel="noopener">Naar Spesa da Antonio &rarr;</a>
    </div>
  </div>

  <footer>italiaansweekmenu.nl</footer>
